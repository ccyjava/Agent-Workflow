[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow"
version = "0.1.0"
description = "A thin workflow runtime that keeps deterministic control flow in code and invokes agents only where intelligence is needed."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
keywords = ["agents", "workflow", "claude-code", "codex", "orchestration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
